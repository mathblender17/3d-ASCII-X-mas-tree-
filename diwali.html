<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Diwali 3D ASCII Tree</title>
<style>

  button:hover{background:#3b2468}
  #st{opacity:.8;min-width:200px}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="row">
  <select id="mode">
    <option value="mk">Making-of: code types, tree builds</option>
    <option value="fin">Final tree (glowing, snowing)</option>
  </select>
  <label>Song <input type="file" id="song" accept="audio/*"></label> <label>start at <input id="off" type="number" value="0" min="0" style="width:56px"> s</label>
  <button id="play">▶ Preview</button>
  <button id="rec">● Record reel &amp; download</button>
  <span id="st">Ready. 24 s, 1080×1920, no voiceover, silent until you load a song.</span>
</div>
<script>

// 4 baubles (lit spheres) and fairy lights

    const t = rnd(), v = rv(), dot = v[0] * dx + v[1] * dy + v[2] * dz, pr = nrm(v[0] - dot * dx, v[1] - dot * dy, v[2] - dot * dz), rho = (1 - t) * .09;

const GIFT = [[200,30,110],[240,130,20],[20,170,160],[200,30,40],[50,70,210],[120,40,170],[220,180,50],[30,140,70],[200,30,40],[240,130,20]];

  }

});
for (let j = 0; j < 16; j++) {
  const a = (j + .5) / 16 * TAU, cx = 5.75 * Math.cos(a), cz = 5.75 * Math.sin(a), o = j / 16 * .8;

  for (let q = 0; q < 40; q++) { const ly = rnd() * .55, sp = .13 * (1 - ly / .6) * (ly > .05 ? 1 : .5); add(cx + (rnd() - .5) * sp * 2, .5 + ly, cz + (rnd() - .5) * sp * 2, [0, 1, 0], ly > .35 ? [255,230,150] : [255,150,30], 8, 6, o + .01, 0, '()^*'.charCodeAt(q % 4)); }

// 8 falling snow and marigold petals (whole cycles per 24 s so the loop is seamless)
for (let i = 0; i < 260; i++) { const a = rnd() * TAU, r = 2.5 + rnd() * 7.5; add(r * Math.cos(a), rnd() * 14, r * Math.sin(a), [0, 1, 0], [[255,150,30],[255,200,61],[255,77,141]][i % 3], 9, 8, 0, 1 + Math.floor(rnd() * 3)); }

const N = P.x.length, F = a => Float32Array.from(a), U = a => Uint8Array.from(a);

const GLOWC = [[255,200,61],[255,150,30],[255,236,190],[255,77,141],[255,200,61],[255,150,30]];

  if (pr[5] > .5) {
    const [px, py, sc] = pj(0, HT + .3, 0), pulse = .85 + .15 * Math.sin(TAU * 3 * tt / D); glow(px, py, sc * 1.3, `rgba(255,190,70,${.42 * pulse})`);
    g.save(); g.translate(px, py);
    for (const [a, L] of [[0, 105], [Math.PI / 2, 105], [Math.PI / 4, 50], [-Math.PI / 4, 50]]) { g.save(); g.rotate(a); const gr = g.createLinearGradient(-L, 0, L, 0); gr.addColorStop(0, 'rgba(255,200,90,0)'); gr.addColorStop(.5, `rgba(255,225,140,${.9 * pulse})`); gr.addColorStop(1, 'rgba(255,200,90,0)'); g.fillStyle = gr; g.fillRect(-L, -1, 2 * L, 2); g.restore(); }
    g.restore();
  }
  if (pr[6] > .5) for (let j = 0; j < 16; j++) { const a = (j + .5) / 16 * TAU, [px, py, sc] = pj(5.75 * Math.cos(a), .7, 5.75 * Math.sin(a)); glow(px, py, sc * .9, `rgba(255,150,40,${.4 + .15 * Math.sin(TAU * 12 * tt / D + j)})`); }
  g.globalCompositeOperation = 'source-over';
  return { letters, lights, ang: (ang * 180 / Math.PI) % 360 };
}

// ---------- background: pure black, a few faint stars ----------
const stars = Array.from({ length: 60 }, () => ({ x: rnd() * W, y: rnd() * H * .6, s: 1 + rnd() * 1.5, k: 1 + Math.floor(rnd() * 4), ph: rnd() * TAU }));

// ---------- the code panel (numpy-style, like the generator itself) ----------
const CODE = [
  '# rangoli floor: a polar mandala\nfor r in np.arange(0.05, 6.4, 0.028):\n    th = np.linspace(0, TAU, int(TAU * r / .04))\n    pts = mandala(r, th, gold, pink, teal)\n\n',
  '# trunk\nth = rng.uniform(0, TAU, 500)\ntrunk = cylinder(0.38, h=1.5, th=th)\n\n',
  '# branches, tier by tier\nfor b in range(nb):\n    a = TAU * b / nb + rng.normal(0, .1)\n    L = R * rng.uniform(0.82, 1.06)\n    n = int(300 + 110 * L)\n    d = np.array([np.cos(a), 0, np.sin(a)])\n    nrm = d * 0.95 + np.array([0, .5, 0])\n\n',
  '# marigold garland\nu = np.linspace(0, 1, 1100)\nbeads = helix(u, turns=6, r=cone(u) + .2)\n\n',
  '# baubles + fairy lights\nfor c in rng.choice(spots, 26):\n    spheres(c, r=.3, col=PALETTE[i % 8])\nlights = spots[:80]\n\n',
  '# the star lantern\nspikes = [axes(6), diagonals(8)]\nplace(top, spikes, col=gold, glow=True)\n\n',
  '# gifts + diyas\nfor g in range(6):\n    box(pos[g], size[g], ribbon=gold)\nfor a in range(8):\n    diya(a * TAU / 8, flame=True)\n\n',
  'while True:\n    cam.orbit(3 * TAU / 24)\n    render(cells, ascii=True)',
];
const TOK = /(#.*|"[^"]*"|\b(?:for|in|while|True|range)\b|-?\d+\.?\d*)/;
function drawCode(bt, y0) {
  g.fillStyle = '#0a0a0a'; g.fillRect(0, y0, W, H - y0);
  let text = '';
  CODE.forEach((c, i) => { const p = cl((bt - ST[i].s) / (ST[i].d * .85)); if (p > 0) text += c.slice(0, Math.floor(p * c.length)); });
  const lines = text.split('\n'), rows = Math.floor((H - y0 - 30) / 38), start = Math.max(0, lines.length - rows), LH = 38;
  g.font = '27px Consolas,"Courier New",monospace';
  const cols = { '#': '#5f5f6e', '"': '#ffd98a' };
  lines.slice(start).forEach((ln, i) => {
    const y = y0 + 40 + i * LH, cur = i === lines.length - start - 1;
    if (cur) { g.fillStyle = 'rgba(255,60,60,.16)'; g.fillRect(0, y - 28, W, LH); }
    g.fillStyle = cur ? '#ff5c5c' : '#444'; g.textAlign = 'right'; g.fillText(String(start + i + 1), 86, y);
    g.textAlign = 'left'; let x = 112;
    ln.split(TOK).forEach(tk => {
      if (!tk) return;
      g.fillStyle = /^(for|in|while|True|range)$/.test(tk) ? '#ff6ac1' : /^-?\d/.test(tk) ? '#ff8c1a' : cols[tk[0]] || '#e6e6f0';
      g.fillText(tk, x, y); x += g.measureText(tk).width;
    });
    if (cur && Math.floor(bt * 3) % 2 === 0) { g.fillStyle = GOLD; g.fillRect(x + 3, y - 24, 13, 30); }
  });
}
function hud(tt, st, y, big) {
  g.textAlign = 'left'; g.font = (big ? 22 : 20) + 'px Consolas,monospace'; g.fillStyle = '#8c8c8c';
  g.fillText('ascii-diwali-tree.py · 2026', 24, y);
  g.fillStyle = '#5e5e5e'; g.fillText(`rotation ${st.ang.toFixed(2)}°    lights ${st.lights}    letters ${st.letters.toLocaleString('en-US')}`, 24, y + 30);
  g.textAlign = 'right'; g.fillStyle = '#6f6f6f'; g.fillText('running · 30 fps', W - 24, y + 30);
  g.fillStyle = '#ff5c8a'; g.fillText(`t ${tt.toFixed(2)}s`, W - 24, y);
}

// ---------- one frame: tt = animation clock, bt = build clock ----------
function frame(tt, bt, mode) {
  const mk = mode === 'mk';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  { const cy = mk ? 560 : 880, wg = g.createRadialGradient(W / 2, cy, 40, W / 2, cy, 640); wg.addColorStop(0, 'rgba(255,140,50,.14)'); wg.addColorStop(1, 'rgba(255,140,50,0)'); g.fillStyle = wg; g.fillRect(0, 0, W, mk ? 1130 : H); }
  g.fillStyle = '#fff';
  for (const s of stars) { g.globalAlpha = .12 + .25 * Math.abs(Math.sin(TAU * s.k * tt / D + s.ph)); g.fillRect(s.x, s.y, s.s, s.s); }
  g.globalAlpha = 1;
  const st = render(tt, bt, mode);
  for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(255,225,190,${.04 + Math.random() * .07})`; g.fillRect(Math.random() * W, Math.random() * (mk ? 1130 : H), 1.5, 1.5); } // film grain
  const a = cl((bt - ST[7].s) / ST[7].d);
  g.globalAlpha = a; g.textAlign = 'center'; g.fillStyle = GOLD; g.shadowColor = GOLD; g.shadowBlur = 10;
  if (mk) { g.font = 'bold 26px Consolas,monospace'; g.fillText('HAPPY DIWALI  ·  दिवाळीच्या हार्दिक शुभेच्छा!', W / 2, 1118); }
  else { g.font = 'bold 34px Consolas,monospace'; g.fillText('H A P P Y   D I W A L I', W / 2, 1530); g.font = '40px "Nirmala UI","Mangal","Noto Sans Devanagari",sans-serif'; g.fillText('दिवाळीच्या हार्दिक शुभेच्छा!', W / 2, 1585); }
  g.shadowBlur = 0; g.globalAlpha = 1;
  if (mk) { hud(tt, st, 1160, false); drawCode(bt, 1225); }
  else {
    hud(tt, st, 54, true);
    g.textAlign = 'center'; g.fillStyle = GOLD; g.shadowColor = GOLD; g.shadowBlur = 16;
    g.font = 'bold 72px Consolas,monospace'; g.fillText('LET DIWALI', W / 2, 1700); g.fillText('FOLLOW YOU', W / 2, 1785);
    g.shadowBlur = 0; g.font = '32px Consolas,monospace'; g.fillStyle = '#ffd98a'; g.fillText('~ shubh deepavali ~', W / 2, 1850);
  }
}

// ---------- music: your own song file (no built-in synth) ----------
let ac, master, dest, songBuf = null;
$('song').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  ac = ac || new AudioContext(); songBuf = await ac.decodeAudioData(await f.arrayBuffer());
  $('st').textContent = `Song loaded: ${f.name} (${songBuf.duration.toFixed(0)} s)`;
};
function startSong(t0) { // plays D seconds of the song from the chosen start second
  if (!songBuf) return;
  const s = ac.createBufferSource(); s.buffer = songBuf; const off = Math.min(+$('off').value || 0, Math.max(0, songBuf.duration - D));
  const fade = ac.createGain(); fade.gain.setValueAtTime(1, t0 + D - 1.5); fade.gain.linearRampToValueAtTime(0, t0 + D);
  s.connect(fade); fade.connect(master); s.start(t0, off, D);
}

// ---------- run / record ----------
let running = false, idleT0 = performance.now();
async function run(record) {
  if (running) return; running = true;
  ac = ac || new AudioContext(); await ac.resume();
  master = ac.createGain(); master.gain.value = .9;
  const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
  let rec, chunks = [], mime = '';
  if (record) {
    dest = ac.createMediaStreamDestination(); comp.connect(dest);
    mime = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    rec = new MediaRecorder(new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]), { mimeType: mime, videoBitsPerSecond: 12e6 });
    rec.ondataavailable = e => chunks.push(e.data);
  }
  const t0 = ac.currentTime + .15, mode = $('mode').value;
  startSong(t0); if (rec) rec.start(1000);
  await new Promise(done => {
    const tick = () => {
      const t = ac.currentTime - t0;
      if (t >= D) return done();
      const tt = Math.max(0, t); frame(tt, mode === "mk" ? tt : 1e9, mode); $('st').textContent = (record ? 'Recording ' : 'Playing ') + tt.toFixed(1) + ' / ' + D + ' s';
      requestAnimationFrame(tick);
    }; tick();
  });
  if (rec) {
    await new Promise(r => { rec.onstop = r; rec.stop(); });
    const ext = mime.includes('mp4') ? 'mp4' : 'webm', a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: mime })); a.download = `diwali-tree-${mode}.${ext}`; a.click();
    $('st').textContent = 'Saved ' + a.download + (ext === 'webm' ? ' (webm: convert to mp4 for Instagram)' : '');
  } else $('st').textContent = 'Done.';
  running = false; idleT0 = performance.now();
}
$('play').onclick = () => run(false);
$('rec').onclick = () => run(true);
(function idle() { // finished picture, still twinkling, until a run starts
  if (!running) frame(((performance.now() - idleT0) / 1000) % D, 1e9, $('mode').value);
  requestAnimationFrame(idle);
})();
</script></body></html>
